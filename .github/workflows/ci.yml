name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  package:
    name: Validate published package contents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Pack and inspect the tarball
        run: |
          npm pack --dry-run > pack-output.txt
          cat pack-output.txt
          if grep -qE '(^|/)(test|bench|examples|\.github)/' pack-output.txt; then
            echo "::error::Development-only files would be published to npm"
            exit 1
          fi

      - name: Install the packed tarball into a clean project and verify both entry points
        run: |
          npm pack
          mkdir -p /tmp/pkg-check
          cd /tmp/pkg-check
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/rajlabs-logger-*.tgz
          node -e "const { createLogger } = require('@rajlabs/logger'); createLogger().info('cjs install check ok');"
          node --input-type=module -e "import('@rajlabs/logger').then(({ createLogger }) => createLogger().info('esm install check ok'));"