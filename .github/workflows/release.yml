name: Release Verification

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Verify package.json version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_TAG#v}"
          echo "package.json version: $PKG_VERSION"
          echo "release tag version:  $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($GITHUB_TAG)"
            exit 1
          fi
        env:
          GITHUB_TAG: ${{ github.event.release.tag_name }}

      - name: Run tests
        run: npm test

      - name: Pack and inspect the tarball
        run: |
          npm pack --dry-run > pack-output.txt
          cat pack-output.txt
          if grep -qE '(^|/)(test|bench|examples|\.github)/' pack-output.txt; then
            echo "::error::Development-only files would be published to npm"
            exit 1
          fi

      - name: Install the packed tarball into a clean project and verify both entry points
        run: |
          npm pack
          mkdir -p /tmp/pkg-check
          cd /tmp/pkg-check
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/rajlabs-logger-*.tgz
          node -e "const { createLogger } = require('@rajlabs/logger'); createLogger().info('cjs install check ok');"
          node --input-type=module -e "import('@rajlabs/logger').then(({ createLogger }) => createLogger().info('esm install check ok'));"
